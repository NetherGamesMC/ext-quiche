[package]
name = "ext-quiche"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "*"
bytes = "1.11.1"
log = "0.4.29"
tokio-quiche = "0.18.0"
tokio = { version = "1.51.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3.32"
thiserror = "2.0.18"
env_logger = "0.11.10"
libc = "0.2.184"
tokio-eventfd = "0.2.2"

[dev-dependencies]
rcgen = "0.14.7"
tempfile = "3.27.0"

[profile.release]
strip = "debuginfo"